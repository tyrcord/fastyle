
plugins {
    id 'com.android.library'
}

// AGP 9 compiles Kotlin itself (built-in Kotlin) unless the app opts out with
// android.builtInKotlin=false, as Flutter 3.47 apps do by default. Only apply
// the Kotlin Gradle Plugin when built-in Kotlin is not active.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
        providers.gradleProperty('android.builtInKotlin').map { it.toBoolean() }.getOrElse(true)
if (!builtInKotlin) {
    pluginManager.apply('org.jetbrains.kotlin.android')
}

group 'com.tyrcord.fastyle_ad'
version '1.0-SNAPSHOT'

android {
    namespace 'com.tyrcord.fastyle_ad'
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Works with both the Kotlin Gradle Plugin and built-in Kotlin, unlike
// android.kotlinOptions, which only exists with the Kotlin Gradle Plugin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
}
