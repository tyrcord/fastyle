name: Update dependency versions

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_dependencies]

env:
  changes: 0

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout the repository
      - name: Checkout the code
        uses: actions/checkout@v4

      # Set up Flutter environment
      - name: Install and set Flutter version
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Create tokens to read the private Git dependencies
      - name: Create token for tyrcord packages
        id: tyrcord-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ALPINETIC_PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALPINETIC_PACKAGES_APP_PRIVATE_KEY }}
          owner: tyrcord
          repositories: fusex
          permission-contents: read

      - name: Create token for alpinetic packages
        id: alpinetic-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ALPINETIC_PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALPINETIC_PACKAGES_APP_PRIVATE_KEY }}
          owner: alpinetic
          repositories: font_awesome_flutter
          permission-contents: read

      # Let pub clone the private Git dependencies over HTTPS
      - name: Configure Git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.tyrcord-token.outputs.token }}@github.com/tyrcord/fusex".insteadOf "git@github.com:tyrcord/fusex"
          git config --global url."https://x-access-token:${{ steps.alpinetic-token.outputs.token }}@github.com/alpinetic/font_awesome_flutter".insteadOf "git@github.com:alpinetic/font_awesome_flutter"
          # font_awesome_flutter keeps its generator data (icons.json) in Git LFS; apps don't need it
          echo "GIT_LFS_SKIP_SMUDGE=1" >> "$GITHUB_ENV"

      # Install Melos
      - name: Install and set Melos version
        uses: bluefireteam/melos-action@v3

      # Update pubspec files
      - name: Update pubspec files
        run: |
          export DEPENDENCY_DATA=$(<./data/dependencies.json) && \
          melos run --no-select update:pubspec

      # Install packages dependencies
      - name: Install packages dependencies
        run: melos bs

      # Check for any changes
      - name: Check for any changes
        id: git-check
        run: |
          git diff --exit-code -- '**/pubspec.yaml' || echo "changes=1" >> $GITHUB_ENV

      # Configure Git
      - name: Configure Git
        if: env.changes == '1'
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

      # Commit and push changes
      - name: Commit and push Changes
        if: env.changes == '1'
        run: |
          git add -u **/pubspec.yaml
          git commit -m "feat: updated dependencies"
          git push
