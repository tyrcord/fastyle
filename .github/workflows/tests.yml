name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**/*.dart" # Trigger only on changes to .dart files
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.dart" # Trigger only on changes to .dart files
  repository_dispatch:
    types: [run_test]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout the code
      - name: Checkout the code
        uses: actions/checkout@v4

      # Set up Flutter environment
      - name: Install and set Flutter version
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Create tokens to read the private Git dependencies
      - name: Create token for tyrcord packages
        id: tyrcord-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ALPINETIC_PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALPINETIC_PACKAGES_APP_PRIVATE_KEY }}
          owner: tyrcord
          repositories: fusex
          permission-contents: read

      - name: Create token for alpinetic packages
        id: alpinetic-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ALPINETIC_PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALPINETIC_PACKAGES_APP_PRIVATE_KEY }}
          owner: alpinetic
          repositories: font_awesome_flutter
          permission-contents: read

      # Let pub clone the private Git dependencies over HTTPS
      - name: Configure Git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.tyrcord-token.outputs.token }}@github.com/tyrcord/fusex".insteadOf "git@github.com:tyrcord/fusex"
          git config --global url."https://x-access-token:${{ steps.alpinetic-token.outputs.token }}@github.com/alpinetic/font_awesome_flutter".insteadOf "git@github.com:alpinetic/font_awesome_flutter"

      # Install Melos
      - name: Install and set Melos version
        uses: bluefireteam/melos-action@v3

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Analyze project source
      - name: Analyze project source
        run: melos run --no-select analyze

      # Run tests
      - name: Run tests
        run: melos run --no-select test
