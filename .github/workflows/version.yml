name: Update packages versions

on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout the repository
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          # This is required to allow another workflow to be triggered
          token: ${{ secrets.CODEX_AUTH }}

      # Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Create tokens to read the private Git dependencies
      - name: Create token for tyrcord packages
        id: tyrcord-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: tyrcord
          repositories: fusex
          permission-contents: read

      - name: Create token for alpinetic packages
        id: alpinetic-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: alpinetic
          repositories: font_awesome_flutter
          permission-contents: read

      # Let pub clone the private Git dependencies over HTTPS
      - name: Configure Git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.tyrcord-token.outputs.token }}@github.com/tyrcord/fusex".insteadOf "git@github.com:tyrcord/fusex"
          git config --global url."https://x-access-token:${{ steps.alpinetic-token.outputs.token }}@github.com/alpinetic/font_awesome_flutter".insteadOf "git@github.com:alpinetic/font_awesome_flutter"

      # Install Melos
      - name: Install and set Melos version
        uses: bluefireteam/melos-action@v3

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # melos bootstrap
      - name: Bootstrap
        run: melos bootstrap

      # Code analysis
      - name: Analyze project source
        run: melos run --no-select analyze

      # Run tests
      - name: Run tests
        run: melos run --no-select test

      # Configure Git
      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

      # Set package versions
      - name: Set package versions
        run: melos version --yes

      # Push version tags
      - name: Push tags
        run: git push --follow-tags
